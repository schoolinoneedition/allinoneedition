name: Frontend syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check external JavaScript files
        run: |
          node --check backend-features.js
          node --check appearance.js
          node --check ultimate-experience.js
      - name: Check appearance, auth, game and security wiring
        run: node tests/frontend-contracts.cjs
      - name: Check inline JavaScript in app and original games
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          checked = 0
          for html_path in ["index.html", "games/originals.html", "games/arcade-pack-2.html"]:
              html = pathlib.Path(html_path).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\\b([^>]*)>([\\s\\S]*?)</script>", html, flags=re.I)
              for index, (attrs, body) in enumerate(scripts):
                  if re.search(r"\\bsrc\\s*=", attrs, flags=re.I):
                      continue
                  path = pathlib.Path(f"/tmp/aio-{pathlib.Path(html_path).stem}-inline-{index}.js")
                  path.write_text(body, encoding="utf-8")
                  result = subprocess.run(["node", "--check", str(path)], text=True, capture_output=True)
                  if result.returncode:
                      print(f"{html_path}: inline script {index} failed syntax check:\\n{result.stderr}")
                      sys.exit(result.returncode)
                  checked += 1
          print(f"Syntax OK: {checked} inline scripts across all three HTML files and 3 external scripts.")
          PY
