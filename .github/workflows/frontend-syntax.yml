name: Frontend syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check external JavaScript files
        run: |
          node --check backend-features.js
          node --check appearance.js
          node --check ultimate-experience.js
          node --check aio-notifications.js
          node --check party-gaming.js
          node --check cloud-gaming.js
          node --check free-cloud-demo.js
          node --check cloud-service-library.js
          node --check cloud-host-ui.js
          node --check api/cloud-host-status.js
          node --check api/cloud-stream-session.js
          node --check cloud-embedded-stream.js
          node --check in-site-play.js
          node --check games/bonus-arcade.js
          node --check games/3x3-originals.js
          node --check game-motion.js
      - name: Install Backblaze B2 Worker dependencies
        run: npm install --prefix cloudflare/media-worker --ignore-scripts --no-audit --no-fund
      - name: Build Cloudflare media Worker without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/media-worker/wrangler.toml --outdir /tmp/aio-media-worker-build
      - name: Build Elementor AI Worker without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/elementor-ai/wrangler.toml --outdir /tmp/aio-elementor-worker-build
      - name: Check appearance, auth, game and security wiring
        run: |
          node tests/frontend-contracts.cjs
          node tests/elementor-work-mode.cjs
          node tests/owner-video-hub.cjs
          node tests/party-gaming.cjs
          node tests/cloud-gaming.cjs
          node tests/free-cloud-demo.cjs
          node tests/cloud-service-library.cjs
          node tests/cloud-host-status.cjs
          node tests/cloud-host-ui.cjs
          node tests/cloud-stream-session.cjs
          node tests/cloud-embedded-stream.cjs
          node tests/in-site-play.cjs
          node tests/bonus-arcade.cjs
          node tests/3x3-originals.cjs
          node tests/community-catalogue.cjs
          node tests/game-motion.cjs
          node tests/real-games-loading.cjs
          node tests/curated-github-pack.cjs
          node tests/notification-ux.cjs
      - name: Audit game catalogue duplicates and required fields
        run: node scripts/audit-games.cjs
      - name: Check inline JavaScript in app and original games
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          checked = 0
          for html_path in ["index.html", "social.html", "study.html", "anime.html", "elementor.html", "owner.html", "video.html", "games/originals.html", "games/arcade-pack-2.html", "games/arcade-pack-3.html"]:
              html = pathlib.Path(html_path).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script>", html, flags=re.I)
              for index, (attrs, body) in enumerate(scripts):
                  if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                      continue
                  path = pathlib.Path(f"/tmp/aio-{pathlib.Path(html_path).stem}-inline-{index}.js")
                  path.write_text(body, encoding="utf-8")
                  result = subprocess.run(["node", "--check", str(path)], text=True, capture_output=True)
                  if result.returncode:
                      print(f"{html_path}: inline script {index} failed syntax check:\n{result.stderr}")
                      sys.exit(result.returncode)
                  checked += 1
          print(f"Syntax OK: {checked} inline scripts across all eight HTML files and 3 external scripts.")
          PY
