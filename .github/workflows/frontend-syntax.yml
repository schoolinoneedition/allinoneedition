name: Frontend syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check external JavaScript files
        run: |
          node --check backend-features.js
          node --check appearance.js
      - name: Check inline JavaScript in index.html
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script>", html, flags=re.I)
          checked = 0
          for index, (attrs, body) in enumerate(scripts):
              if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                  continue
              path = pathlib.Path(f"/tmp/aio-inline-{index}.js")
              path.write_text(body, encoding="utf-8")
              result = subprocess.run(["node", "--check", str(path)], text=True, capture_output=True)
              if result.returncode:
                  print(f"Inline script {index} failed syntax check:\\n{result.stderr}")
                  sys.exit(result.returncode)
              checked += 1
          print(f"Syntax OK: {checked} inline scripts and 2 external scripts.")
          PY
