<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>All in One Edition · Arcade Pack 2</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1120;color:#eef3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1a2942,#0b1120 65%)}main{width:min(900px,100%);margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:clamp(23px,4vw,34px);margin:0}p{color:#aab8d2;line-height:1.5}.pill{border:1px solid #344762;border-radius:99px;padding:7px 11px;color:#a9caff;font-size:12px}.panel{border:1px solid #293951;border-radius:18px;background:#111b2d;padding:clamp(12px,3vw,22px);box-shadow:0 18px 55px #0003}.toolbar,.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.btn,select,input{font:inherit;border:1px solid #3a4e6c;border-radius:10px;background:#1b2a42;color:#f2f6ff;padding:10px 13px}.btn{cursor:pointer}.btn:hover{background:#2a4061}.status{margin-left:auto;color:#91e7c0;font-size:14px}.arena{min-height:300px;display:grid;place-items:center;border:1px solid #263852;border-radius:14px;padding:18px;background:#0b1424}.grid{display:grid;gap:7px;max-width:100%;width:420px}.cell{min-width:0;aspect-ratio:1;border:1px solid #3b5070;border-radius:8px;background:#1a2b43;color:#f2f6ff;font-size:clamp(14px,3vw,24px);font-weight:700;cursor:pointer}.cell:hover{filter:brightness(1.2)}.cell.active{background:#5ce1a5;color:#092014}.cell.warn{background:#ff9a76;color:#2b1008}.cell.good{background:#82aaff;color:#0b1730}.big{font-size:clamp(24px,5vw,48px);font-weight:800;text-align:center;letter-spacing:.06em}.sub{color:#aab8d2;text-align:center}.tile-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:min(420px,100%)}.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:#263b59;font-size:clamp(16px,4vw,30px);font-weight:800}.tile[data-v="2"],.tile[data-v="4"]{background:#395274}.tile[data-v="8"],.tile[data-v="16"]{background:#416f7b}.tile[data-v="32"],.tile[data-v="64"]{background:#4c927f}.tile[data-v="128"],.tile[data-v="256"]{background:#b18b4d;color:#201707}.word-input{width:min(320px,100%);text-align:center;text-transform:uppercase;letter-spacing:.15em}.footer{font-size:12px;color:#7488a7;margin-top:14px}@media(max-width:520px){main{padding:12px}.status{width:100%;margin:0}.arena{padding:10px;min-height:260px}}
</style>
</head>
<body><main>
<header><div><h1 id="title">Arcade Pack 2</h1><p>Ten more original games, hosted directly by All in One Edition.</p></div><span class="pill">Original mini-games</span></header>
<section class="panel"><div class="toolbar"><select id="mode" aria-label="Choose a game">
<option value="maze">Maze Runner</option><option value="math">Math Dash</option><option value="color">Color Match</option><option value="typing">Typing Sprint</option><option value="mole">Whack-a-Mole</option><option value="target">Target Tap</option><option value="merge">Number Merge</option><option value="lights">Lights Out</option><option value="connect">Connect Four</option><option value="sequence">Pattern Recall</option></select><button class="btn" id="restart">Restart</button><span class="status" id="status" aria-live="polite">Ready</span></div>
<div class="arena" id="arena"></div><p id="hint"></p><div class="footer">Keyboard and touch controls are supported where appropriate. No third-party game files are loaded.</div></section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const modes=['maze','math','color','typing','mole','target','merge','lights','connect','sequence'];
const titles={maze:'Maze Runner',math:'Math Dash',color:'Color Match',typing:'Typing Sprint',mole:'Whack-a-Mole',target:'Target Tap',merge:'Number Merge',lights:'Lights Out',connect:'Connect Four',sequence:'Pattern Recall'};
let mode=new URLSearchParams(location.search).get('game');if(!modes.includes(mode))mode='maze';let cleanup=()=>{};
function setStatus(s){$('status').textContent=s}function hint(s){$('hint').textContent=s}function arena(s){$('arena').innerHTML=s}
function btn(t,cls='cell'){return '<button type="button" class="'+cls+'">'+t+'</button>'}
function start(){cleanup();cleanup=()=>{};$('mode').value=mode;$('title').textContent=titles[mode];setStatus('Ready');hint('');({maze,math,color,typing,mole,target,merge,lights,connect,sequence})[mode]()}
$('mode').onchange=e=>{mode=e.target.value;const u=new URL(location.href);u.searchParams.set('game',mode);history.replaceState({},'',u);start()};$('restart').onclick=start;
function maze(){let pos=0,steps=0;const walls=new Set([1,4,6,9,14,17,19,22,24,27,30,33,35,38,41,43,46,49,52,55,57,60,63,65,68,71,74,77,79,82,85,88,91,94]);const goal=99;function render(){let s='<div class="grid" style="grid-template-columns:repeat(10,minmax(0,1fr));width:min(500px,100%)">';for(let i=0;i<100;i++){let text=i===pos?'●':i===goal?'★':'';s+= '<div class="cell '+(i===pos?'active':walls.has(i)?'warn':'')+'" style="display:grid;place-items:center;cursor:default">'+text+'</div>'}s+='</div>';arena(s);setStatus('Steps: '+steps)}function move(d){let x=pos%10,y=Math.floor(pos/10),nx=x+d[0],ny=y+d[1];if(nx<0||nx>9||ny<0||ny>9)return;let n=ny*10+nx;if(walls.has(n))return;pos=n;steps++;render();if(pos===goal)setStatus('Maze cleared in '+steps+' steps!')}function key(e){const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(m[e.key]){e.preventDefault();move(m[e.key])}}window.addEventListener('keydown',key);render();hint('Reach ★ without walking through orange walls. Use arrow keys or WASD.');cleanup=()=>window.removeEventListener('keydown',key)}
function math(){let answer=0,score=0,round=0;function next(){round++;const a=1+Math.floor(Math.random()*20),b=1+Math.floor(Math.random()*15),op=Math.random()<.5?'+':'−';answer=op==='+'?a+b:a-b;arena('<div style="width:min(400px,100%);text-align:center"><div class="big">'+a+' '+op+' '+b+' = ?</div><p>Pick the answer</p><div class="grid" id="answers" style="grid-template-columns:repeat(2,1fr)">'+[answer,answer+1+Math.floor(Math.random()*4),answer-1-Math.floor(Math.random()*4),answer+2+Math.floor(Math.random()*5)].sort(()=>Math.random()-.5).map(n=>btn(n)).join('')+'</div></div>');[...$('answers').children].forEach(b=>b.onclick=()=>{if(Number(b.textContent)===answer){score++;setStatus('Score: '+score);next()}else{setStatus('Not quite · score '+score);next()}})}next();hint('Solve as many quick addition and subtraction questions as you can.')}
function color(){const colors=[['RED','#ff6b86'],['BLUE','#82aaff'],['GREEN','#5ce1a5'],['GOLD','#e2b74c']];let score=0,round=0,expected='';function next(){round++;const shown=colors[Math.floor(Math.random()*4)],word=colors[Math.floor(Math.random()*4)];expected=word[0];arena('<div style="text-align:center"><div class="big" style="color:'+shown[1]+'">'+word[0]+'</div><p>Tap the colour of the letters, not the word</p><div class="controls" style="justify-content:center">'+colors.map(c=>'<button class="btn" data-c="'+c[0]+'" style="border-color:'+c[1]+'">'+c[0]+'</button>').join('')+'</div></div>');[...$('arena').querySelectorAll('[data-c]')].forEach(b=>b.onclick=()=>{if(b.dataset.c===shown[0])score++;setStatus('Score: '+score+' / '+round);next()})}next();hint('A quick Stroop-style challenge: identify the text colour, ignoring the word itself.')}
function typing(){const words=['comet','garden','puzzle','window','planet','orange','silver','rocket','bridge','forest','castle','thunder','bright','pixel','bubble'];let word='',score=0,started=0,timer=0;function next(){word=words[Math.floor(Math.random()*words.length)];arena('<div style="text-align:center;width:min(420px,100%)"><div class="big">'+word+'</div><input class="word-input" id="typed" autocomplete="off" placeholder="TYPE THE WORD"><p>Correct words: <b id="score">'+score+'</b></p><button class="btn" id="submit">Submit</button></div>');const input=$('typed');input.focus();function check(){if(input.value.trim().toLowerCase()===word){score++;setStatus('Correct · '+score);next()}else{input.value='';setStatus('Try again')}}$('submit').onclick=check;input.onkeydown=e=>{if(e.key==='Enter')check()}}next();hint('Type each displayed word exactly. There is no artificial time limit.')}
function mole(){let score=0,round=0,active=-1,timer=null;function next(){clearTimeout(timer);round++;active=Math.floor(Math.random()*16);arena('<div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr))">'+Array.from({length:16},(_,i)=>btn(i===active?'●':'')).join('')+'</div>');[...$('arena').querySelectorAll('button')].forEach((b,i)=>b.onclick=()=>{if(i===active){score++;setStatus('Hits: '+score);next()}else{setStatus('Miss · hits '+score);next()}});timer=setTimeout(()=>{active=-1;setStatus('Time · hits '+score);next()},1400)}next();hint('Tap the circle before it moves. Each round gives you a short window.');cleanup=()=>clearTimeout(timer)}
function target(){let score=0,round=0,timer=null;function next(){clearTimeout(timer);round++;const x=8+Math.random()*76,y=8+Math.random()*76;arena('<div style="position:relative;width:min(520px,100%);height:280px;background:#101e32;border-radius:12px"><button id="target" class="cell active" style="position:absolute;left:'+x+'%;top:'+y+'%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%">+</button></div>');$('target').onclick=()=>{score++;setStatus('Hits: '+score);next()};timer=setTimeout(()=>{setStatus('Round '+round+' · score '+score);next()},1600)}next();hint('Tap the moving target before the round times out.');cleanup=()=>clearTimeout(timer)}
function merge(){let board=Array(16).fill(0),score=0;function spawn(){const empty=board.map((v,i)=>v?null:i).filter(v=>v!==null);if(empty.length)board[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.88?2:4}function draw(){arena('<div class="tile-board">'+board.map(v=>'<div class="tile" data-v="'+v+'">'+(v||'')+'</div>').join('')+'</div>');setStatus('Score: '+score)}function move(dir){let changed=false;for(let line=0;line<4;line++){let ids=Array.from({length:4},(_,j)=>dir==='left'?line*4+j:dir==='right'?line*4+3-j:dir==='up'?j*4+line:(3-j)*4+line);let vals=ids.map(i=>board[i]).filter(Boolean);for(let j=0;j<vals.length-1;j++)if(vals[j]===vals[j+1]){vals[j]*=2;score+=vals[j];vals.splice(j+1,1)}while(vals.length<4)vals.push(0);ids.forEach((id,j)=>{if(board[id]!==vals[j])changed=true;board[id]=vals[j]})}if(changed){spawn();draw()}}function key(e){const m={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};if(m[e.key]){e.preventDefault();move(m[e.key])}}window.addEventListener('keydown',key);spawn();spawn();draw();hint('Join equal numbers to build larger tiles. Use arrow keys or WASD.');cleanup=()=>window.removeEventListener('keydown',key)}
function lights(){let board=Array.from({length:25},()=>Math.random()<.5);let moves=0;function toggle(i){const x=i%5,y=Math.floor(i/5);[ [x,y],[x-1,y],[x+1,y],[x,y-1],[x,y+1] ].forEach(([a,b])=>{if(a>=0&&a<5&&b>=0&&b<5)board[b*5+a]=!board[b*5+a]});moves++;render()}function render(){arena('<div class="grid" style="grid-template-columns:repeat(5,minmax(0,1fr));width:min(400px,100%)">'+board.map((v,i)=>'<button class="cell '+(v?'active':'')+'" data-i="'+i+'" aria-label="Toggle light '+(i+1)+'">'+(v?'●':'')+'</button>').join('')+'</div>');$('arena').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>toggle(Number(b.dataset.i)));setStatus(board.some(Boolean)?'Moves: '+moves:'Solved in '+moves+' moves!')}render();hint('Turn every light off. Tapping a square toggles it and its neighbours.')}
function connect(){const board=Array(42).fill(''),human='R',cpu='Y',over=false;let ended=over;function wins(mark){for(let r=0;r<6;r++)for(let c=0;c<7;c++){const i=r*7+c;if(c<4&&[0,1,2,3].every(n=>board[i+n]===mark)||r<3&&[0,1,2,3].every(n=>board[i+n*7]===mark)||r<3&&c<4&&[0,1,2,3].every(n=>board[i+n*8]===mark)||r<3&&c>2&&[0,1,2,3].every(n=>board[i+n*6]===mark))return true}return false}function drop(c,mark){for(let r=5;r>=0;r--){const i=r*7+c;if(!board[i]){board[i]=mark;return true}}return false}function render(){arena('<div class="grid" style="grid-template-columns:repeat(7,minmax(0,1fr));width:min(500px,100%)">'+board.map((v,i)=>'<button class="cell '+(v==='R'?'warn':v==='Y'?'active':'')+'" data-c="'+(i%7)+'" '+(ended?'disabled':'')+'>'+(v==='R'?'●':v==='Y'?'●':'')+'</button>').join('')+'</div>');$('arena').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(ended)return;const c=Number(b.dataset.c);if(!drop(c,human))return;if(wins(human)){ended=true;setStatus('You win!');render();return}if(board.every(Boolean)){ended=true;setStatus('Draw!');render();return}let col=Math.floor(Math.random()*7),tries=0;while(!board.slice(col,42).some(v=>!v)&&tries++<8)col=Math.floor(Math.random()*7);if(!drop(col,cpu)){ended=true;setStatus('Draw!');render();return}if(wins(cpu)){ended=true;setStatus('Computer wins');render();return}if(board.every(Boolean)){ended=true;setStatus('Draw!');render();return}setStatus('Your turn');render()})}render();hint('Connect four counters in a row. You play red; the computer plays yellow.')}
function sequence(){let seq=[],input=[],round=0,locked=true,timer=null;const colors=['#ff6b86','#5ce1a5','#82aaff','#e2b74c'];function flash(i){const b=$('arena').querySelector('[data-i="'+i+'"]');if(b){b.style.background=colors[i];setTimeout(()=>{if(b)b.style.background=''},280)}}function render(){arena('<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));width:min(320px,100%)">'+colors.map((c,i)=>'<button class="cell" data-i="'+i+'" style="min-height:120px">'+(i+1)+'</button>').join('')+'</div>');$('arena').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(locked)return;const i=Number(b.dataset.i);flash(i);if(seq[input.length]!==i){locked=true;setStatus('Finished at round '+round);return}input.push(i);if(input.length===seq.length){locked=true;setStatus('Correct!');timer=setTimeout(next,650)}})}function next(){round++;seq.push(Math.floor(Math.random()*4));input=[];locked=true;render();setStatus('Watch round '+round);seq.forEach((n,i)=>{timer=setTimeout(()=>{flash(n);if(i===seq.length-1){timer=setTimeout(()=>{locked=false;setStatus('Repeat the pattern')},450)}},i*650+300)})}next();hint('Memorise the flashing pattern and repeat it. Each round adds one step.');cleanup=()=>clearTimeout(timer)}
start();
})();
</script></body></html>
