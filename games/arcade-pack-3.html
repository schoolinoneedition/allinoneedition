const $=id=>document.getElementById(id);
const titleById=new Map(GAMES.map(g=>[g.id,g]));
let selected=new URLSearchParams(location.search).get('game');
if(!titleById.has(selected))selected=GAMES[0].id;

function status(s){$('status').textContent=s}
function hint(s){$('hint').textContent=s}
function show(s){$('arena').innerHTML=s}
function button(text,cls='cell',extra=''){return '<button type="button" class="'+cls+'" '+extra+'>'+text+'</button>'}
function pick(n){return Math.floor(Math.random()*n)}
function start(){cleanup();cleanup=()=>{};$('mode').value=selected;const g=titleById.get(selected);$('title').textContent=g.name;status('Ready');hint('');({reaction,math,pairs,sequence,scramble,typing,color,odd,order,aim,lights,maze,timing,wordpick,count,pattern,keyreflex,ttt,connect,merge})[g.type](g.variant)}
$('mode').onchange=e=>{selected=e.target.value;const u=new URL(location.href);u.searchParams.set('game',selected);history.replaceState({},'',u);start()};

function reaction(v){let score=0,round=0,armed=false,timer=null,started=0;function next(){clearTimeout(timer);round++;armed=false;started=0;show('<div class="wide"><div class="big">Wait for green</div><p>Round '+round+' · tap only when the panel turns green</p>'+button('WAIT','btn','id="react" style="width:100%;min-height:120px;background:#713e4a;font-size:24px')+'</div>');const b=$('react');b.onclick=()=>{if(!armed){clearTimeout(timer);status('Too early! Score '+score);b.textContent='Too early · tap to retry';b.onclick=next;return}score++;status('Reaction '+(performance.now()-started|0)+' ms · score '+score);next()};timer=setTimeout(()=>{armed=true;started=performance.now();b.style.background='#246b50';b.textContent='TAP NOW'},900+pick(1800-v*150))}next();hint('Wait for green, then tap quickly. Early taps reset the round.');cleanup=()=>clearTimeout(timer)}
function math(v){let score=0,round=0,answer=0;const ops=[['+', (a,b)=>a+b],['−',(a,b)=>a-b],['×',(a,b)=>a*b],['÷',(a,b)=>a]];function next(){round++;let op=ops[v%4],a=2+pick(8+v*3),b=2+pick(7+v*2);if(v===3){a=a*b}answer=op[1](a,b);const options=new Set([answer]);while(options.size<4)options.add(answer+pick(11+v*3)-5-v);show('<div class="wide"><div class="big">'+a+' '+op[0]+' '+b+' = ?</div><p>Question '+round+' of 10</p><div class="options">'+[...options].sort(()=>Math.random()-.5).map(n=>button(n,'btn','data-answer="'+n+'"')).join('')+'</div></div>');$('arena').querySelectorAll('[data-answer]').forEach(b=>$('arena')&& (b.onclick=()=>{if(Number(b.dataset.answer)===answer)score++;if(round>=10){status('Final score: '+score+'/10');hint('Press Restart to play another round.');$('arena').querySelectorAll('button').forEach(x=>x.disabled=true)}else{status('Score '+score+'/'+round);next()}}))}next();hint(['Solve the addition and subtraction challenge.','Race through mixed arithmetic.','Multiplication focus.','Division and inverse-operation challenge.','Solve the arithmetic quiz.'][v])}
function pairs(v){const symbols=['◆','●','▲','★','♥','☀','☂','♫','✿','⬟'];const count=4+v*2,deck=[...symbols.slice(0,count/2),...symbols.slice(0,count/2)].sort(()=>Math.random()-.5);let open=[],matched=new Set(),moves=0,lock=false;function draw(){show('<div class="grid" style="grid-template-columns:repeat('+Math.min(4,count/2)+',minmax(0,1fr));width:min(480px,100%)">'+deck.map((x,i)=>button(matched.has(i)?x:open.includes(i)?x:'?', 'cell '+(matched.has(i)?'active':''),'data-i="'+i+'" '+(matched.has(i)||open.includes(i)||lock?'disabled':''))).join('')+'</div>');status('Pairs '+matched.size/2+'/'+count/2+' · turns '+moves);$('arena').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(lock)return;const i=Number(b.dataset.i);open.push(i);if(open.length===2){moves++;if(deck[open[0]]===deck[open[1]]){open.forEach(j=>matched.add(j));open=[];draw();if(matched.size===count){status('Cleared in '+moves+' turns!')} }else{lock=true;draw();setTimeout(()=>{open=[];lock=false;draw()},650)}}else draw()})}draw();hint('Find matching pairs. Each game uses a different grid size.')}
function sequence(v){let seq=[],turn=0,entry=[],lock=true,timer;const colors=['#ff6b86','#5ce1a5','#82aaff','#e2b74c','#b49aff','#ffad66'];function flash(i){const b=$('arena').querySelector('[data-i="'+i+'"]');if(b){b.style.background=colors[i];setTimeout(()=>{if(b)b.style.background=''},250)}}function draw(){show('<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));width:min(360px,100%)">'+colors.slice(0,4+Math.floor(v/2)).map((c,i)=>button(i+1,'cell','data-i="'+i+'" style="min-height:80px"')).join('')+'</div>');$('arena').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(lock)return;const i=Number(b.dataset.i);flash(i);if(seq[entry.length]!==i){lock=true;status('Pattern ended at round '+turn);return}entry.push(i);if(entry.length===seq.length){lock=true;status('Correct!');timer=setTimeout(next,550)}})}function next(){turn++;seq.push(pick(4+Math.floor(v/2)));entry=[];lock=true;draw();status('Watch sequence '+turn);seq.forEach((n,i)=>timer=setTimeout(()=>{flash(n);if(i===seq.length-1)timer=setTimeout(()=>{lock=false;status('Repeat it')},350)},i*520+200))}next();hint('Watch the pattern, then repeat it. The sequence grows every round.');cleanup=()=>clearTimeout(timer)}
const WORDS=['planet','rocket','garden','puzzle','silver','bridge','forest','castle','thunder','pixel','bubble','comet','window','orange','turtle','magnet','jungle','pencil','velvet','candle','galaxy','crystal','harvest','lantern','rainbow','marble','journey','whistle','diamond','volcano'];
function scramble(v){let score=0,word='',tries=0;function next(){tries++;word=WORDS.filter(w=>w.length>=4+v&&w.length<=7+v)[pick(WORDS.filter(w=>w.length>=4+v&&w.length<=7+v).length)]||WORDS[pick(WORDS.length)];let s=word.split('');for(let i=s.length-1;i>0;i--){const j=pick(i+1);[s[i],s[j]]=[s[j],s[i]]}if(s.join('')===word)s.reverse();show('<div class="wide"><div class="big" style="letter-spacing:.14em">'+s.join('')+'</div><p>Unscramble the word · score '+score+'</p><input id="answer" class="word-input" autocomplete="off" placeholder="Your answer"><p>'+button('Check','btn','id="check"')+'</p></div>');$('answer').focus();function check(){if($('answer').value.trim().toLowerCase()===word){score++;status('Correct · '+score);next()}else status('Not that one. Try again.')} $('check').onclick=check;$('answer').onkeydown=e=>{if(e.key==='Enter')check()}}next();hint('Rearrange the letters into a real word.')}
function typing(v){let score=0,round=0,word='';const pool=WORDS.filter(w=>w.length>=4+Math.floor(v/2));function next(){round++;word=pool[pick(pool.length)];show('<div class="wide"><div class="big">'+word+'</div><p>Type the word exactly</p><input id="typed" class="word-input" autocomplete="off" placeholder="Start typing"><p>Words completed: '+score+'</p>'+button('Submit','btn','id="submit"')+'</div>');$('typed').focus();function check(){if($('typed').value.trim().toLowerCase()===word){score++;status('Correct · '+score);next()}else{status('Try again');$('typed').value=''}}$('submit').onclick=check;$('typed').onkeydown=e=>{if(e.key==='Enter')check()}}next();hint('A typing accuracy challenge with increasingly long words.')}
function color(v){const cols=[['RED','#ff657e'],['BLUE','#82aaff'],['GREEN','#5ce1a5'],['GOLD','#e2b74c'],['PURPLE','#b49aff'],['ORANGE','#ffad66']];let score=0,round=0;function next(){round++;const choices=cols.slice(0,4+v%3),word=cols[pick(6)],ink=choices[pick(choices.length)];show('<div class="wide"><div class="big" style="color:'+ink[1]+'">'+word[0]+'</div><p>Choose the colour of the letters, not the written word</p><div class="options">'+choices.map(c=>button(c[0],'btn','data-col="'+c[0]+'"')).join('')+'</div></div>');$('arena').querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{if(b.dataset.col===ink[0])score++;status('Score '+score+'/'+round);next()})}next();hint('Ignore the word itself and identify the ink colour.')}
function odd(v){let score=0,round=0;const icons=['●','▲','◆','★','■','♥','✿','☀'];function next(){round++;const base=icons[pick(icons.length)],other=icons[(icons.indexOf(base)+1+pick(icons.length-1))%icons.length],n=9+v*3,oddAt=pick(n);show('<div class="wide"><p>Find the one symbol that is different</p><div class="grid" style="grid-template-columns:repeat(6,minmax(0,1fr))">'+Array.from({length:n},(_,i)=>button(i===oddAt?other:base,'cell','data-i="'+i+'"')).join('')+'</div></div>');$('arena').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(Number(b.dataset.i)===oddAt)score++;status('Score '+score+'/'+round);next()})}next();hint('Scan the grid and tap the single different symbol.')}
function order(v){const n=9+v*4;let nextNum=1;const nums=Array.from({length:n},(_,i)=>i+1).sort(()=>Math.random()-.5);function draw(){show('<div class="wide"><p>Tap numbers in ascending order, starting at 1</p><div class="grid" style="grid-template-columns:repeat(5,minmax(0,1fr))">'+nums.map(x=>button(x,'cell','data-n="'+x+'" '+(x<nextNum?'disabled':''))).join('')+'</div></div>');status(nextNum>n?'Completed all '+n+' numbers!':'Next: '+nextNum);$('arena').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(Number(b.dataset.n)===nextNum){nextNum++;if(nextNum>n){status('Completed all '+n+' numbers!');draw();return}}else{status('Wrong order. Next is '+nextNum)}draw()})}draw();hint('Find each number in order. The board grows with each difficulty.')}
function aim(v){let score=0,round=0,timer=null;function next(){clearTimeout(timer);round++;const n=3+Math.floor(v/2),target=pick(n*n);show('<div class="grid" style="grid-template-columns:repeat('+n+',minmax(0,1fr));width:min(440px,100%)">'+Array.from({length:n*n},(_,i)=>button(i===target?'✦':'','cell '+(i===target?'active':''),'data-i="'+i+'"')).join('')+'</div>');$('arena').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(Number(b.dataset.i)===target){score++;status('Hits '+score);next()}else{status('Miss · hits '+score);next()}});timer=setTimeout(()=>{status('Time · score '+score);next()},1300-v*120)}next();hint('Hit the highlighted beacon. Wrong taps cost the round.');cleanup=()=>clearTimeout(timer)}
function lights(v){const n=3+(v%3),board=Array.from({length:n*n},()=>Math.random()<.45);let moves=0;function flip(i){const x=i%n,y=Math.floor(i/n);[[x,y],[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([a,b])=>{if(a>=0&&a<n&&b>=0&&b<n)board[b*n+a]=!board[b*n+a]});moves++;draw()}function draw(){show('<div class="grid" style="grid-template-columns:repeat('+n+',minmax(0,1fr));width:min(400px,100%)">'+board.map((on,i)=>button(on?'●':'','cell '+(on?'active':''),'data-i="'+i+'"')).join('')+'</div>');status(board.some(Boolean)?'Moves: '+moves:'Solved in '+moves+' moves!');$('arena').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>flip(Number(b.dataset.i)))}draw();hint('Turn all lights off. Each tap also toggles the neighbouring lights.')}
function maze(v){const n=7+v,wall=new Set();for(let y=1;y<n-1;y++)for(let x=1;x<n-1;x++)if(y!==0&&x!==n-1&&Math.random()<.18&&x!==y)wall.add(y*n+x);let pos=0,steps=0;const goal=n*n-1;wall.delete(0);wall.delete(goal);function move(dx,dy){const x=pos%n,y=Math.floor(pos/n),nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=n||ny>=n)return;const next=ny*n+nx;if(wall.has(next))return;pos=next;steps++;draw();if(pos===goal)status('Escaped in '+steps+' steps!')}function key(e){const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(m[e.key]){e.preventDefault();move(...m[e.key])}}function draw(){show('<div class="grid" style="grid-template-columns:repeat('+n+',minmax(0,1fr));width:min(500px,100%)">'+Array.from({length:n*n},(_,i)=>'<div class="cell '+(i===pos?'active':wall.has(i)?'warn':'')+'" style="display:grid;place-items:center;cursor:default">'+(i===pos?'●':i===goal?'★':'')+'</div>').join('')+'</div>');status('Steps: '+steps)}window.addEventListener('keydown',key);draw();hint('Reach the star with arrow keys or WASD. Orange cells are walls.');cleanup=()=>window.removeEventListener('keydown',key)}
function timing(v){let x=0,dir=1,score=0,round=0,timer=null;function draw(){show('<div class="wide"><div class="big">Stop in the green zone</div><div class="meter"><div class="zone"></div><div class="needle" style="left:'+x+'%"></div></div><p>Round '+(round+1)+' · score '+score+'</p>'+button('STOP','btn','id="stop"')+'</div>');$('stop').onclick=()=>{clearInterval(timer);round++;if(x>=42&&x<=58)score++;status('Score '+score+'/'+round);if(round>=10){hint('Final score: '+score+'/10. Restart for another run.');$('stop').disabled=true}else begin()}}function begin(){x=0;dir=1;draw();timer=setInterval(()=>{x+=dir*(2+v*.65);if(x>99){x=99;dir=-1}if(x<0){x=0;dir=1}const needle=$('arena').querySelector('.needle');if(needle)needle.style.left=x+'%'},20)}begin();hint('Stop the moving marker inside the green target zone.');cleanup=()=>clearInterval(timer)}
const Q=[['rapid','fast','slow','bright'],['tiny','small','huge','soft'],['silent','quiet','noisy','gentle'],['begin','start','finish','pause'],['ancient','old','future','modern'],['brave','bold','fearful','calm'],['assist','help','hinder','ignore'],['correct','right','wrong','false'],['repair','fix','break','lose'],['observe','watch','hide','forget']];
function wordpick(v){let score=0,round=0;function next(){round++;const q=Q[pick(Q.length)],word=q[0],correct=q[1],choices=[correct,q[2],q[3],Q[pick(Q.length)][1]].sort(()=>Math.random()-.5);show('<div class="wide"><div class="big">'+word+'</div><p>Choose the closest meaning</p><div class="options">'+[...new Set(choices)].map(c=>button(c,'btn','data-word="'+c+'"')).join('')+'</div></div>');$('arena').querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{if(b.dataset.word===correct)score++;status('Score '+score+'/'+round);if(round>=10){hint('Final score: '+score+'/10. Restart to try again.');$('arena').querySelectorAll('button').forEach(x=>x.disabled=true)}else next()})}next();hint('Choose the closest synonym for each word.')}
function count(v){let score=0,round=0;const icons=['●','▲','◆','★','♥','✿'];function next(){round++;const target=icons[pick(icons.length)],n=16+v*4,arr=Array.from({length:n},()=>icons[pick(icons.length)]),answer=arr.filter(x=>x===target).length;show('<div class="wide"><div class="big">Count the '+target+' symbols</div><div class="grid" style="grid-template-columns:repeat(6,minmax(0,1fr))">'+arr.map(x=>'<div class="cell" style="display:grid;place-items:center;cursor:default">'+x+'</div>').join('')+'</div><div class="options" style="margin:12px auto">'+[answer,Math.max(0,answer-2),answer+2,answer+1].sort(()=>Math.random()-.5).map(n=>button(n,'btn','data-count="'+n+'"')).join('')+'</div></div>');$('arena').querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{if(Number(b.dataset.count)===answer)score++;status('Score '+score+'/'+round);next()})}next();hint('Count only the requested symbol. Grids get larger at higher levels.')}
function pattern(v){let score=0,round=0;function next(){round++;const a=1+pick(5),step=1+v+pick(3),seq=[a,a+step,a+step*2,a+step*3],answer=a+step*4,options=[answer,answer+1,answer-step,answer+step+2].sort(()=>Math.random()-.5);show('<div class="wide"><div class="big">'+seq.join(' · ')+' · ?</div><p>Find the next number</p><div class="options">'+options.map(n=>button(n,'btn','data-val="'+n+'"')).join('')+'</div></div>');$('arena').querySelectorAll('[data-val]').forEach(b=>b.onclick=()=>{if(Number(b.dataset.val)===answer)score++;status('Score '+score+'/'+round);if(round>=10){hint('Final score: '+score+'/10. Restart to continue.');$('arena').querySelectorAll('button').forEach(x=>x.disabled=true)}else next()})}next();hint('Work out the rule behind the number sequence.')}
function keyreflex(v){let target='',ready=false,score=0,round=0,timer=null;function next(){clearTimeout(timer);round++;ready=false;target=String.fromCharCode(65+pick(26));show('<div class="wide"><div class="big" id="key-target">Get ready…</div><p>Press the displayed key when it appears</p>'+button('WAIT','btn','id="key-stage" style="width:100%;min-height:100px;font-size:28px')+'</div>');$('key-stage').onclick=()=>{};timer=setTimeout(()=>{ready=true;$('key-target').textContent=target;$('key-stage').textContent='PRESS '+target;status('Round '+round)},700+pick(1800-v*150))}function key(e){if(!ready)return;if(e.key.toUpperCase()===target){score++;ready=false;status('Correct · '+score);if(round>=10){hint('Score '+score+'/10. Restart to play again.');return}next()}else{ready=false;status('Wrong key · score '+score);if(round>=10)hint('Score '+score+'/10. Restart to play again.');else next()}}window.addEventListener('keydown',key);next();hint('Wait for the letter, then press that key. Early keys do not count.');cleanup=()=>{clearTimeout(timer);window.removeEventListener('keydown',key)}}
function ttt(v){let b=Array(9).fill(''),done=false,turn=0;function win(p){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(line=>line.every(i=>b[i]===p))}function draw(){show('<div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));width:min(360px,100%)">'+b.map((x,i)=>button(x||'','cell '+(x==='X'?'warn':x==='O'?'active':''),'data-i="'+i+'" '+(done||x?'disabled':''))).join('')+'</div>');$('arena').querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.i);if(done||b[i])return;b[i]='X';turn++;if(win('X')){done=true;status('You win!');draw();return}if(b.every(Boolean)){done=true;status('Draw!');draw();return}const free=b.map((x,j)=>x?null:j).filter(x=>x!==null);b[free[pick(free.length)]]='O';turn++;if(win('O')){done=true;status('Computer wins');draw();return}if(b.every(Boolean)){done=true;status('Draw!');draw();return}draw()})}draw();hint('You are X. Play against a simple computer opponent.')}
function connect(v){const b=Array(42).fill(''),done=false;let ended=done;function win(p){for(let r=0;r<6;r++)for(let c=0;c<7;c++){const i=r*7+c;if(c<4&&[0,1,2,3].every(n=>b[i+n]===p)||r<3&&[0,1,2,3].every(n=>b[i+n*7]===p)||r<3&&c<4&&[0,1,2,3].every(n=>b[i+n*8]===p)||r<3&&c>2&&[0,1,2,3].every(n=>b[i+n*6]===p))return true}return false}function drop(c,p){for(let r=5;r>=0;r--){const i=r*7+c;if(!b[i]){b[i]=p;return true}}return false}function draw(){show('<div class="grid" style="grid-template-columns:repeat(7,minmax(0,1fr));width:min(500px,100%)">'+b.map((x,i)=>button(x||'','cell '+(x==='X'?'warn':x==='O'?'active':''),'data-c="'+i%7+'" '+(ended?'disabled':''))).join('')+'</div>');$('arena').querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{if(ended)return;const c=Number(el.dataset.c);if(!drop(c,'X'))return;if(win('X')){ended=true;status('You win!');draw();return}if(b.every(Boolean)){ended=true;status('Draw!');draw();return}const cols=Array.from({length:7},(_,i)=>i).filter(c=>b[c]===''||b[c+7]===''||b[c+14]===''||b[c+21]===''||b[c+28]===''||b[c+35]==='');if(!cols.length){ended=true;status('Draw!');draw();return}drop(cols[pick(cols.length)],'O');if(win('O')){ended=true;status('Computer wins');draw();return}if(b.every(Boolean)){ended=true;status('Draw!');draw();return}draw()})}draw();hint('Drop counters into columns to connect four. You play X; the computer plays O.')}
function merge(v){let b=Array(16).fill(0),score=0;function spawn(){const e=b.map((x,i)=>x?null:i).filter(x=>x!==null);if(e.length)b[e[pick(e.length)]]=Math.random()<.88?2:4}function draw(){show('<div class="tile-board">'+b.map(x=>'<div class="tile" data-v="'+x+'">'+(x||'')+'</div>').join('')+'</div>');status('Score '+score)}function move(dir){let changed=false;for(let line=0;line<4;line++){const ids=Array.from({length:4},(_,j)=>dir==='left'?line*4+j:dir==='right'?line*4+3-j:dir==='up'?j*4+line:(3-j)*4+line);let a=ids.map(i=>b[i]).filter(Boolean);for(let j=0;j<a.length-1;j++)if(a[j]===a[j+1]){a[j]*=2;score+=a[j];a.splice(j+1,1)}while(a.length<4)a.push(0);ids.forEach((id,j)=>{if(b[id]!==a[j])changed=true;b[id]=a[j]})}if(changed){spawn();draw()}}function key(e){const m={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};if(m[e.key]){e.preventDefault();move(m[e.key])}}window.addEventListener('keydown',key);spawn();spawn();draw();hint('Combine matching tiles using arrow keys or WASD.');cleanup=()=>window.removeEventListener('keydown',key)}
start();
