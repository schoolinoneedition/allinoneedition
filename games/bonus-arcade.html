<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AIO Arcade · Bonus Games</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a1121;color:#edf4ff}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:12px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 15% 10%,#203a62,transparent 40%),#0a1121}
main{width:min(100%,510px);margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
h1{font-size:clamp(18px,4vw,24px);margin:0;letter-spacing:-.035em}
#subtitle{font-size:11px;color:#b7c7de;margin:3px 0 0}
.score{border:1px solid #344666;background:#172744;border-radius:12px;padding:7px 11px;font-size:11px;text-align:right;white-space:nowrap;line-height:1.6}
.score strong{font-size:15px;color:#edf4ff}
.stage{border:1px solid #3a4d72;border-radius:18px;background:#0c1630;position:relative;overflow:hidden;box-shadow:0 14px 36px #02070d7a}
canvas{width:100%;height:auto;aspect-ratio:7/10;display:block;touch-action:none;outline-offset:-4px}
.overlay{position:absolute;inset:0;background:rgba(5,13,27,.86);display:grid;place-items:center;padding:24px;text-align:center}
.overlay[hidden]{display:none}
.overlay .inner{max-width:300px}
.overlay h2{font-size:clamp(24px,6vw,31px);margin:0 0 9px}
.overlay p{font-size:13px;line-height:1.6;color:#bfcee5;margin:0 0 19px}
button{font-family:inherit;cursor:pointer}
.overlay button{background:#547bec;color:#fff;border:1px solid #87a5ff;border-radius:12px;font-size:13px;font-weight:850;padding:11px 24px}
.controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:11px}
.controls button{min-width:49px;min-height:40px;border:1px solid #3f5477;color:#ecf3ff;background:#1a2a48;border-radius:10px;font-size:13px;font-weight:800;padding:8px 12px}
.controls button:active{background:#4568c8}
.controls button:focus-visible,.overlay button:focus-visible,canvas:focus-visible{outline:3px solid #9cc1ff;outline-offset:2px}
.controls .wide{min-width:86px}
.hint{min-height:20px;margin:9px 4px 0;font-size:11px;text-align:center;color:#b7c7e2;line-height:1.5}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:440px){body{padding:6px}.controls{gap:5px}.controls button{min-width:43px;padding:8px 9px}.stage{border-radius:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main aria-label="All in One Edition bonus arcade">
<header><div><h1 id="title">AIO Bonus Arcade</h1><p id="subtitle">Four original games, playable right here</p></div><div class="score" aria-live="polite"><span id="scoreLabel">Score</span> <strong id="score">0</strong><div><span>Best</span> <strong id="best">0</strong></div></div></header>
<div class="stage">
<canvas id="board" width="420" height="600" tabindex="0" aria-label="Game board. Use the arrow buttons below or your keyboard."></canvas>
<div class="overlay" id="overlay">
<div class="inner"><h2 id="overlayTitle">Ready?</h2><p id="overlayText"></p><button id="play" type="button">Play game</button></div>
</div></div>
<div class="controls" aria-label="Game controls">
<button type="button" data-dir="left" aria-label="Move left">◀</button>
<button type="button" data-dir="up" aria-label="Move up">▲</button>
<button type="button" data-dir="down" aria-label="Move down">▼</button>
<button type="button" data-dir="right" aria-label="Move right">▶</button>
<button type="button" id="pause" class="wide">Pause</button>
<button type="button" id="restart" class="wide">Restart</button>
</div>
<p class="hint" id="hint">Arrow keys or touch controls work on all devices.</p>
<div class="sr-only" role="status" aria-live="polite" id="announcer"></div>
</main>
<script src="/games/bonus-arcade.js" defer></script>
</body>
</html>
