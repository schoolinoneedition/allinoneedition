<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>All in One Edition Arcade</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c31;--line:#2c3855;--text:#f5f7ff;--muted:#a7b2cc;--accent:#82aaff;--good:#5ce1a5;--bad:#ff6b86}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a2a4c 0,#0b1020 55%);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:clamp(10px,3vw,28px)}main{width:min(900px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}h1{font-size:clamp(24px,4vw,36px);letter-spacing:-1px;margin:0}p{color:var(--muted);margin:5px 0 0}.pill{font-size:12px;border:1px solid var(--line);padding:5px 9px;border-radius:999px;color:var(--muted);white-space:nowrap}.panel{background:rgba(20,28,49,.94);border:1px solid var(--line);border-radius:20px;padding:clamp(14px,3vw,24px);box-shadow:0 16px 50px #0003}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar select,.btn{background:#202b45;color:var(--text);border:1px solid #3a496a;border-radius:11px;padding:10px 13px;font:inherit;font-weight:700}.btn{cursor:pointer}.btn:hover,.toolbar select:focus-visible{border-color:var(--accent)}.status{margin-left:auto;color:var(--muted);font-size:14px}.board{display:grid;gap:8px;justify-content:center;align-content:center;margin:12px auto;max-width:100%;touch-action:manipulation}.tile{border:1px solid #405175;background:#202b45;color:var(--text);border-radius:12px;min-width:0;min-height:54px;font:800 20px system-ui;cursor:pointer}.tile:hover{border-color:var(--accent)}.tile:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.tile.revealed{background:#334566}.tile.good{background:#174e43;border-color:var(--good)}.tile.bad{background:#5d2639;border-color:var(--bad)}canvas{display:block;width:min(100%,640px);height:auto;aspect-ratio:4/3;background:#090e1a;border:1px solid #34415f;border-radius:14px;margin:12px auto;touch-action:pan-y}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}.controls .btn{min-width:54px}.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}.ttt{grid-template-columns:repeat(3,min(22vw,105px));}.ttt .tile{height:min(22vw,105px);font-size:clamp(28px,7vw,48px)}.memory{grid-template-columns:repeat(4,min(17vw,100px));}.memory .tile{height:min(17vw,100px);font-size:clamp(19px,4vw,30px)}.mine{grid-template-columns:repeat(9,min(8.5vw,42px));gap:3px}.mine .tile{height:min(8.5vw,42px);min-height:0;font-size:clamp(11px,2.8vw,16px);border-radius:6px;padding:0}.slide{grid-template-columns:repeat(4,min(19vw,86px));gap:5px}.slide .tile{height:min(19vw,86px);font-size:clamp(18px,4vw,28px)}.simon{grid-template-columns:repeat(2,min(32vw,150px));}.simon .tile{height:min(32vw,150px);opacity:.85}.simon .tile:nth-child(1){background:#df5267}.simon .tile:nth-child(2){background:#3cae84}.simon .tile:nth-child(3){background:#477de0}.simon .tile:nth-child(4){background:#e2b74c}.simon .tile.lit{opacity:1;filter:brightness(1.7);transform:scale(.97)}.reaction-target{width:min(100%,560px);min-height:240px;border:1px solid var(--line);border-radius:16px;background:#202b45;color:var(--text);font-size:clamp(20px,4vw,32px);font-weight:850;cursor:pointer}.reaction-target.ready{background:#137a55}.reaction-target.wait{background:#7c3348}.word{font-size:clamp(25px,6vw,42px);letter-spacing:.25em;text-align:center;font-weight:900;margin:22px 0}.input{display:block;width:min(100%,280px);margin:12px auto;background:#0b1020;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;text-transform:uppercase;text-align:center}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:15px;color:var(--muted);font-size:12px}@media(max-width:520px){.status{width:100%;margin-left:0}.panel{border-radius:15px}.tile{min-height:46px}.toolbar{align-items:stretch}.toolbar select{flex:1}}
</style>
</head>
<body>
<main>
<header><div><h1 id="title">All in One Edition Arcade</h1><p id="subtitle">Quick games. No installs. Just play.</p></div><span class="pill">Original mini-games</span></header>
<section class="panel">
<div class="toolbar"><select id="mode" aria-label="Choose a game"><option value="snake">Snake Sprint</option><option value="memory">Memory Match</option><option value="reaction">Reaction Rush</option><option value="breakout">Brick Breaker</option><option value="ttt">Tic-Tac-Toe</option><option value="pong">Paddle Pong</option><option value="mines">Minefield Logic</option><option value="slide">Sliding 15</option><option value="simon">Simon Sequence</option><option value="word">Word Scramble</option></select><button class="btn" id="restart">Restart</button><span class="status" id="status" aria-live="polite">Ready</span></div>
<div id="game" aria-label="Game area"></div>
<div class="hint" id="hint"></div>
<div class="footer"><span>Made for All in One Edition</span><span>Keyboard and touch controls where supported</span></div>
</section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),allowed=['snake','memory','reaction','breakout','ttt','pong','mines','slide','simon','word'];
let mode=allowed.includes(params.get('game'))?params.get('game'):'snake',cleanup=()=>{},score=0;
const titles={snake:'Snake Sprint',memory:'Memory Match',reaction:'Reaction Rush',breakout:'Brick Breaker',ttt:'Tic-Tac-Toe',pong:'Paddle Pong',mines:'Minefield Logic',slide:'Sliding 15',simon:'Simon Sequence',word:'Word Scramble'};
function status(s){$('status').textContent=s}function hint(s){$('hint').textContent=s}function game(markup){$('game').innerHTML=markup}function button(text,cls='tile'){return '<button type="button" class="'+cls+'">'+text+'</button>'}
function canvas(){game('<canvas id="screen" width="640" height="480" aria-label="'+titles[mode]+' game canvas"></canvas>');return $('screen').getContext('2d')}
function start(){cleanup();cleanup=()=>{};score=0;$('title').textContent=titles[mode];$('mode').value=mode;status('Ready');hint('');if(mode==='snake')snake();else if(mode==='memory')memory();else if(mode==='reaction')reaction();else if(mode==='breakout')breakout();else if(mode==='ttt')ttt();else if(mode==='pong')pong();else if(mode==='mines')mines();else if(mode==='slide')slide();else if(mode==='simon')simon();else word();}
$('mode').addEventListener('change',e=>{mode=e.target.value;const u=new URL(location.href);u.searchParams.set('game',mode);history.replaceState({},'',u);start()});$('restart').addEventListener('click',start);
function snake(){const size=20,cell=22,ctx=canvas();let body=[{x:8,y:10},{x:7,y:10},{x:6,y:10}],dir={x:1,y:0},next={...dir},food,dead=false,points=0,last=0,raf=0;function spawn(){do{food={x:Math.floor(Math.random()*size),y:Math.floor(Math.random()*size)}}while(body.some(p=>p.x===food.x&&p.y===food.y))}function draw(){ctx.fillStyle='#090e1a';ctx.fillRect(0,0,640,480);ctx.fillStyle='#17233b';for(let y=0;y<21;y++)for(let x=0;x<28;x++)ctx.fillRect(x*cell+1,y*cell+1,cell-2,cell-2);ctx.fillStyle='#ff6b86';ctx.beginPath();ctx.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*.36,0,Math.PI*2);ctx.fill();body.forEach((p,i)=>{ctx.fillStyle=i?'#4f8cce':'#5ce1a5';ctx.fillRect(p.x*cell+2,p.y*cell+2,cell-4,cell-4)});ctx.fillStyle='#f5f7ff';ctx.font='18px system-ui';ctx.fillText('Score: '+points,12,28)}function tick(t){if(dead)return;if(t-last>105){last=t;dir=next;const head={x:body[0].x+dir.x,y:body[0].y+dir.y};if(head.x<0||head.y<0||head.x>=size||head.y>=size||body.some((p,i)=>i>0&&p.x===head.x&&p.y===head.y)){dead=true;status('Game over · '+points+' points');draw();ctx.fillStyle='#fff';ctx.font='bold 32px system-ui';ctx.fillText('Game over',235,240);return}body.unshift(head);if(head.x===food.x&&head.y===food.y){points++;status('Score: '+points);spawn()}else body.pop();draw()}raf=requestAnimationFrame(tick)}function key(e){const k=e.key.toLowerCase(),map={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(!map[k])return;e.preventDefault();const v=map[k];if(v[0]!==-dir.x||v[1]!==-dir.y)next={x:v[0],y:v[1]}}window.addEventListener('keydown',key);spawn();draw();raf=requestAnimationFrame(tick);hint('Move with arrow keys or WASD. On touch, use the buttons below.');$('game').insertAdjacentHTML('beforeend','<div class="controls">'+button('↑','btn')+button('←','btn')+button('↓','btn')+button('→','btn')+'</div>');const controls=[...$('game').querySelectorAll('.btn')],dirs=[{x:0,y:-1},{x:-1,y:0},{x:0,y:1},{x:1,y:0}];controls.forEach((b,i)=>b.onclick=()=>{const v=dirs[i];if(v.x!==-dir.x||v.y!==-dir.y)next=v});cleanup=()=>{cancelAnimationFrame(raf);window.removeEventListener('keydown',key)}}
function memory(){const faces=['🍎','🚀','🌙','🎲','⭐','🎧','🍀','⚡'],deck=[...faces,...faces].sort(()=>Math.random()-.5);let open=[],matched=new Set(),moves=0,lock=false;game('<div class="board memory">'+deck.map((_,i)=>button('?', 'tile')).join('')+'</div>');const cells=[...$('game').querySelectorAll('button')];cells.forEach((b,i)=>b.onclick=()=>{if(lock||matched.has(i)||open.includes(i))return;b.textContent=deck[i];b.classList.add('revealed');open.push(i);if(open.length===2){moves++;status('Moves: '+moves);if(deck[open[0]]===deck[open[1]]){open.forEach(n=>matched.add(n));open=[];if(matched.size===deck.length)status('You won in '+moves+' moves!')}else{lock=true;const prev=[...open];setTimeout(()=>{prev.forEach(n=>{cells[n].textContent='?';cells[n].classList.remove('revealed')});open=[];lock=false},650)}}});status('Moves: 0');hint('Find all eight matching pairs. Works with mouse or touch.')}
function reaction(){let state='idle',timer=0,started=0;game('<div style="display:grid;place-items:center"><button id="target" class="reaction-target">Tap to start</button></div>');const b=$('target');function click(){if(state==='idle'){state='wait';b.className='reaction-target wait';b.textContent='Wait for green…';status('Get ready');timer=setTimeout(()=>{state='ready';started=performance.now();b.className='reaction-target ready';b.textContent='CLICK NOW!'},900+Math.random()*2600)}else if(state==='wait'){clearTimeout(timer);state='idle';b.className='reaction-target';b.textContent='Too soon! Tap to retry';status('False start')}else if(state==='ready'){const ms=Math.round(performance.now()-started);state='done';b.className='reaction-target';b.textContent=ms+' ms · Tap to try again';status('Reaction: '+ms+' ms')}else{state='idle';b.className='reaction-target';b.textContent='Tap to start';status('Ready')}}b.onclick=click;cleanup=()=>clearTimeout(timer);hint('Tap once, wait for green, then tap as fast as you can.')}
function breakout(){const ctx=canvas();let paddle={x:260,y:448,w:120,h:12},ball={x:320,y:420,dx:3.1,dy:-3.6,r:8},bricks=[],points=0,raf=0,keys={},running=true;for(let r=0;r<5;r++)for(let c=0;c<9;c++)bricks.push({x:18+c*68,y:38+r*25,w:60,h:16,on:true,color:['#82aaff','#5ce1a5','#e2b74c','#e08cff','#ff8a76'][r]});function draw(){ctx.fillStyle='#090e1a';ctx.fillRect(0,0,640,480);bricks.filter(b=>b.on).forEach(b=>{ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h)});ctx.fillStyle='#e5ecff';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.fillStyle='#5ce1a5';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='18px system-ui';ctx.fillText('Score: '+points,12,24)}function tick(){if(!running)return;if(keys.ArrowLeft||keys.a)paddle.x-=7;if(keys.ArrowRight||keys.d)paddle.x+=7;paddle.x=Math.max(0,Math.min(640-paddle.w,paddle.x));ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<ball.r||ball.x>640-ball.r)ball.dx*=-1;if(ball.y<ball.r)ball.dy*=-1;if(ball.dy>0&&ball.y+ball.r>=paddle.y&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.dy=-Math.abs(ball.dy);ball.dx+=(ball.x-(paddle.x+paddle.w/2))/35}for(const b of bricks)if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y-ball.r<b.y+b.h&&ball.y+ball.r>b.y){b.on=false;ball.dy*=-1;points++;status('Score: '+points);break}if(ball.y>490){running=false;status('Missed · '+points+' points');ctx.fillStyle='#fff';draw();ctx.font='bold 30px system-ui';ctx.fillText('Game over',240,260);return}if(!bricks.some(b=>b.on)){running=false;status('You cleared the board!');draw();ctx.fillStyle='#fff';ctx.font='bold 30px system-ui';ctx.fillText('You win!',260,260);return}draw();raf=requestAnimationFrame(tick)}function key(e){if(['ArrowLeft','ArrowRight','a','d'].includes(e.key)){keys[e.key]=e.type==='keydown';e.preventDefault()}}function move(e){const rect=$('screen').getBoundingClientRect();paddle.x=(e.clientX-rect.left)/rect.width*640-paddle.w/2}window.addEventListener('keydown',key);window.addEventListener('keyup',key);$('screen').addEventListener('pointermove',move);draw();raf=requestAnimationFrame(tick);cleanup=()=>{running=false;cancelAnimationFrame(raf);window.removeEventListener('keydown',key);window.removeEventListener('keyup',key)};hint('Move the paddle with ← → or A/D, or move your pointer across the board.')}
function ttt(){let board=Array(9).fill(''),turn='X',over=false;game('<div class="board ttt">'+board.map(()=>button('')).join('')+'</div>');const cells=[...$('game').querySelectorAll('button')];function win(mark){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(line=>line.every(i=>board[i]===mark))}function draw(){cells.forEach((b,i)=>{b.textContent=board[i];b.classList.toggle('good',board[i]==='X');b.classList.toggle('bad',board[i]==='O');b.disabled=!!board[i]||over});if(over)status(win('X')||win('O')?'Winner: '+(win('X')?'X':'O'):'Draw game');else status('Turn: '+turn)}cells.forEach((b,i)=>b.onclick=()=>{if(board[i]||over)return;board[i]=turn;if(win(turn)){over=true;draw();return}if(board.every(Boolean)){over=true;draw();return}turn=turn==='X'?'O':'X';draw()});draw();hint('Local two-player game. Take turns on the same device.')}
function pong(){const ctx=canvas();let a=210,b=210,ball={x:320,y:240,dx:4,dy:2.8},points=[0,0],keys={},raf=0,running=true;function reset(dir){ball={x:320,y:240,dx:4*dir,dy:(Math.random()*3-1.5)}}function tick(){if(!running)return;if(keys.w||keys.ArrowUp)a-=6;if(keys.s||keys.ArrowDown)a+=6;a=Math.max(0,Math.min(390,a));b+=(ball.y-60-b)*.045;b=Math.max(0,Math.min(390,b));ball.x+=ball.dx;ball.y+=ball.dy;if(ball.y<8||ball.y>472)ball.dy*=-1;if(ball.dx<0&&ball.x<38&&ball.y>a&&ball.y<a+90){ball.dx=Math.abs(ball.dx)*1.04;ball.dy+=(ball.y-a-45)*.04}if(ball.dx>0&&ball.x>602&&ball.y>b&&ball.y<b+90){ball.dx=-Math.abs(ball.dx)*1.04;ball.dy+=(ball.y-b-45)*.04}if(ball.x<0){points[1]++;reset(1)}if(ball.x>640){points[0]++;reset(-1)}ctx.fillStyle='#090e1a';ctx.fillRect(0,0,640,480);ctx.setLineDash([8,12]);ctx.strokeStyle='#34415f';ctx.beginPath();ctx.moveTo(320,0);ctx.lineTo(320,480);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#82aaff';ctx.fillRect(20,a,14,90);ctx.fillStyle='#5ce1a5';ctx.fillRect(606,b,14,90);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,7);ctx.fill();ctx.font='28px system-ui';ctx.fillText(points[0],270,40);ctx.fillText(points[1],350,40);status('You '+points[0]+' · CPU '+points[1]);raf=requestAnimationFrame(tick)}function key(e){const k=e.key==='ArrowUp'?'ArrowUp':e.key==='ArrowDown'?'ArrowDown':e.key.toLowerCase();if(['w','s','ArrowUp','ArrowDown'].includes(k)){keys[k]=e.type==='keydown';e.preventDefault()}}window.addEventListener('keydown',key);window.addEventListener('keyup',key);tick();cleanup=()=>{running=false;cancelAnimationFrame(raf);window.removeEventListener('keydown',key);window.removeEventListener('keyup',key)};hint('Move your left paddle with W/S or ↑/↓. The right paddle is controlled by the computer.')}
function mines(){const n=9,bombs=10,values=Array(81).fill(0),mineSet=new Set();while(mineSet.size<bombs){const p=Math.floor(Math.random()*81);mineSet.add(p)}for(const p of mineSet){for(let y=Math.max(0,Math.floor(p/9)-1);y<=Math.min(8,Math.floor(p/9)+1);y++)for(let x=Math.max(0,p%9-1);x<=Math.min(8,p%9+1);x++){const i=y*9+x;if(!mineSet.has(i))values[i]++}}let opened=new Set(),flags=new Set(),ended=false,flagMode=false;game('<div class="controls"><button class="btn" id="flagMode">Flag mode: off</button></div><div class="board mine">'+values.map((_,i)=>button('')).join('')+'</div>');$('flagMode').onclick=()=>{$('flagMode').textContent='Flag mode: '+(flagMode?'off':'on');flagMode=!flagMode};const cells=[...$('game').querySelectorAll('.mine button')];function reveal(i){if(ended||opened.has(i)||flags.has(i))return;if(mineSet.has(i)){ended=true;mineSet.forEach(m=>{cells[m].textContent='✹';cells[m].classList.add('bad')});status('Mine hit · restart to try again');return}opened.add(i);cells[i].textContent=values[i]||'';cells[i].classList.add('revealed');if(!values[i]){const x=i%9,y=Math.floor(i/9);for(let yy=Math.max(0,y-1);yy<=Math.min(8,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(8,x+1);xx++){const j=yy*9+xx;if(!opened.has(j))reveal(j)}}if(opened.size===81-bombs){ended=true;status('Field cleared! You win!')}else status('Safe tiles: '+opened.size+' / '+(81-bombs))}cells.forEach((b,i)=>{b.onclick=()=>{if(flagMode){if(opened.has(i))return;if(flags.has(i)){flags.delete(i);b.textContent=''}else{flags.add(i);b.textContent='⚑'}status('Flags: '+flags.size+' / '+bombs)}else reveal(i)};b.oncontextmenu=e=>{e.preventDefault();if(opened.has(i)||ended)return;if(flags.has(i)){flags.delete(i);b.textContent=''}else{flags.add(i);b.textContent='⚑'}status('Flags: '+flags.size+' / '+bombs)}});status('Find all '+(81-bombs)+' safe tiles');hint('Tap Flag mode to mark suspected mines on touchscreens. Right-click also flags a tile.')}
function slide(){let nums;let moves=0;function shuffled(){nums=Array.from({length:16},(_,i)=>(i+1)%16);for(let i=nums.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]]}if(!solvable(nums)||nums.every((n,i)=>n===((i+1)%16)))shuffled()}function solvable(a){let inv=0;for(let i=0;i<15;i++)for(let j=i+1;j<16;j++)if(a[i]&&a[j]&&a[i]>a[j])inv++;return (inv+4-Math.floor(a.indexOf(0)/4))%2===1}function render(){game('<div class="board slide">'+nums.map(n=>button(n||'')).join('')+'</div>');const cells=[...$('game').querySelectorAll('button')];cells.forEach((b,i)=>{if(!nums[i]){b.style.visibility='hidden';return}b.onclick=()=>move(i)});status('Moves: '+moves)}function move(i){const z=nums.indexOf(0);if(Math.abs(i%4-z%4)+Math.abs(Math.floor(i/4)-Math.floor(z/4))!==1)return;[nums[i],nums[z]]=[nums[z],nums[i]];moves++;render();if(nums.every((n,i)=>n===((i+1)%16)))status('Solved in '+moves+' moves!')}shuffled();render();hint('Arrange the tiles from 1 to 15 with the blank at the bottom-right.')}
function simon(){const seq=[],input=[];let round=0,locked=true,timer=0;game('<div class="board simon">'+['Red','Green','Blue','Yellow'].map(c=>button(c)).join('')+'</div>');const cells=[...$('game').querySelectorAll('button')];function flash(i){cells[i].classList.add('lit');timer=setTimeout(()=>cells[i].classList.remove('lit'),280)}function play(i=0){locked=true;if(i>=seq.length){locked=false;input.length=0;status('Your turn · '+round+' lights');return}flash(seq[i]);timer=setTimeout(()=>play(i+1),520)}function next(){round++;seq.push(Math.floor(Math.random()*4));status('Watch the sequence');timer=setTimeout(()=>play(),350)}cells.forEach((b,i)=>b.onclick=()=>{if(locked)return;flash(i);if(seq[input.length]!==i){locked=true;status('Game over · reached round '+round);return}input.push(i);if(input.length===seq.length){locked=true;status('Correct!');setTimeout(next,650)}});next();cleanup=()=>clearTimeout(timer);hint('Repeat the colour sequence in the same order. Each round adds one more light.')}
function word(){const words=['PLANET','GARDEN','PUZZLE','ROCKET','JUNGLE','CASTLE','BREEZE','ORANGE','MYSTERY','THUNDER'];let answer=words[Math.floor(Math.random()*words.length)],scramble=answer.split('').sort(()=>Math.random()-.5).join(''),tries=0,done=false;while(scramble===answer)scramble=answer.split('').sort(()=>Math.random()-.5).join('');game('<div class="word" id="scramble">'+scramble+'</div><p style="text-align:center">Unscramble the word</p><input class="input" id="guess" maxlength="12" autocomplete="off" aria-label="Your guess" placeholder="TYPE YOUR GUESS"><div class="controls"><button class="btn" id="submit">Check answer</button><button class="btn" id="skip">New word</button></div>');function check(){if(done)return;tries++;if($('guess').value.trim().toUpperCase()===answer){done=true;status('Correct in '+tries+' tries!');$('scramble').textContent=answer}else{status('Not quite · try '+(tries+1));$('guess').select()}}$('submit').onclick=check;$('guess').onkeydown=e=>{if(e.key==='Enter')check()};$('skip').onclick=()=>word();status('Tries: 0');hint('Type the letters in the correct order.')}
start();
})();
</script>
</body>
</html>
