<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">3×3 +1 Keyboard Escape game cover</title>
<desc id="desc">A sharp black 3 by 3 wordmark, electric-blue keycaps, a plus one badge, and keyboard escape name.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f2ff"/><stop offset="1" stop-color="#aed0ff"/></linearGradient>
</defs>
<rect width="640" height="640" rx="48" fill="url(#bg)"/>
<path d="M44 65h552v350H44z" rx="28" fill="#f7fbff" opacity=".68"/>
<g font-family="Arial Black, Arial, sans-serif" font-weight="900" fill="#151a23">
<text x="56" y="262" font-size="167" letter-spacing="-18">3×3</text>
</g>
<g transform="translate(407 98)">
<rect x="0" y="0" width="160" height="115" rx="23" fill="#162b4a"/>
<rect x="6" y="6" width="148" height="99" rx="17" fill="#387edc"/>
<text x="80" y="78" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="white">+1</text>
</g>
<g transform="translate(77 315)">
<rect width="487" height="151" rx="24" fill="#1a2b49" stroke="#0c203f" stroke-width="6"/>
<g fill="#e8f3ff" stroke="#6b94c5" stroke-width="3">
<rect x="17" y="18" width="75" height="47" rx="9"/>
<rect x="105" y="18" width="75" height="47" rx="9"/>
<rect x="193" y="18" width="75" height="47" rx="9"/>
<rect x="281" y="18" width="75" height="47" rx="9"/>
<rect x="369" y="18" width="99" height="47" rx="9"/>
<rect x="17" y="82" width="95" height="51" rx="9"/>
<rect x="126" y="82" width="232" height="51" rx="9"/>
<rect x="371" y="82" width="97" height="51" rx="9"/>
</g>
<g fill="#173353" font-family="Arial Black, Arial, sans-serif" font-weight="900" text-anchor="middle">
<text x="54" y="51" font-size="26">W</text><text x="143" y="51" font-size="26">A</text>
<text x="231" y="51" font-size="26">S</text><text x="319" y="51" font-size="26">D</text><text x="420" y="49" font-size="23">↑</text>
<text x="65" y="117" font-size="21">←</text><text x="242" y="117" font-size="20">SPACE</text><text x="419" y="117" font-size="21">→</text>
</g>
</g>
<g font-family="Arial Black, Arial, sans-serif" font-weight="900" fill="#151a23">
<text x="46" y="544" font-size="49" letter-spacing="-2">KEYBOARD ESCAPE</text>
</g>
<rect x="47" y="559" width="344" height="8" rx="4" fill="#397fdc"/>
<text x="48" y="603" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f527b">MOVE • SOLVE • ESCAPE</text>
</svg>